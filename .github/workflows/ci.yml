name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_platform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agent -d agent_platform_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://agent:agent@localhost:5432/agent_platform_test
      REDIS_URL: redis://localhost:6379
      # Pull requests only run what the diff affects; pushes to main run everything.
      TURBO_FILTER: ${{ github.event_name == 'pull_request' && format('--filter=...[origin/{0}]', github.base_ref) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan for secrets
        run: ./scripts/check-secrets.sh
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm turbo run lint $TURBO_FILTER
      - name: Typecheck
        run: pnpm turbo run typecheck $TURBO_FILTER
      - name: Test
        run: pnpm turbo run test $TURBO_FILTER
      - name: Crash recovery demo (kills a worker, verifies resume and no double execution)
        run: pnpm crash-demo
