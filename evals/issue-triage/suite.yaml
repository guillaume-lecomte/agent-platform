# Eval suite for the issue-triage agent. See packages/evals for the format.
name: issue-triage
suite_version: 1
description: 40 synthetic issues for the fictional project "Tasklane" (no real data). Each case checks the final JSON answer and the tool calls made.
agent: issue-triage
output_schema:
  {
    type: object,
    required: [category, priority, labels, comment],
    properties:
      {
        category: { enum: [bug, feature, question, duplicate] },
        priority: { enum: [P0, P1, P2, P3] },
        labels: { type: array, items: { type: string } },
        duplicate_of: { type: [integer, 'null'] },
        comment: { type: string, minLength: 1 },
      },
  }
gate: { max_overall_drop: 0.03, max_category_drop: 0.08 }
cases:
  - id: bug-01
    category: bug
    weight: 1
    input:
      number: 201
      title: Server crashes on startup after upgrading to 2.4.0
      body: 'After upgrading from 2.3.2 to 2.4.0 the server process exits immediately on startup with "Error: column tasks.archived_at does not exist". Nobody can reach the instance, so all users are locked out. Steps to reproduce: 1) run 2.3.2, 2) pull the 2.4.0 image, 3) start the container. Rolling back is not possible because the migration already ran.'
    graders:
      - { type: json_schema, weight: 1 }
      - { type: exact, path: category, expected: bug, weight: 3 }
      - { type: exact, path: priority, expected: P0, weight: 2 }
      - { type: array_includes, path: labels, value: bug, weight: 1 }
      - { type: regex, path: comment, pattern: thank, flags: i, weight: 1 }
      - { type: tool_called, tool: search_similar_issues, weight: 1 }
      - { type: tool_called, tool: add_labels, weight: 0.5 }
      - { type: tool_called, tool: post_comment, weight: 0.5 }
  - id: bug-02
    category: bug
    weight: 1
    input:
      number: 202
      title: Deleting a project permanently deletes tasks that belong to other projects
      body: 'When I delete the project "Archive 2024" every task I had moved out of it earlier is gone as well, including tasks in two other active projects. This is data loss and there is no trash to recover from. Steps to reproduce: create two projects, move a task from A to B, delete A, open B. Version 2.4.1.'
    graders:
      - { type: json_schema, weight: 1 }
      - { type: exact, path: category, expected: bug, weight: 3 }
      - { type: exact, path: priority, expected: P0, weight: 2 }
      - { type: array_includes, path: labels, value: bug, weight: 1 }
      - { type: regex, path: comment, pattern: thank, flags: i, weight: 1 }
      - { type: tool_called, tool: search_similar_issues, weight: 1 }
      - { type: tool_called, tool: add_labels, weight: 0.5 }
      - { type: tool_called, tool: post_comment, weight: 0.5 }
