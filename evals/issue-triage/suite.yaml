      title: 'XSS: task title is rendered unescaped in notification emails'
      body: A task titled <img src=x onerror=alert(1)> renders as HTML in the reminder email, so any user who can create a task can inject markup into emails sent to their teammates. This looks like a stored XSS vulnerability in the email template.
